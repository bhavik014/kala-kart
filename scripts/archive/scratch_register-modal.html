<div id="register-modal" class="fixed inset-0 z-50 hidden bg-[#2b2d42]/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#fffdfa] rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-[10px_16px_0px_#c2593f] border-3 border-[#2b2d42] relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleModal('register-modal')" class="absolute top-5 right-5 text-[#6c757d] hover:text-[#2b2d42] p-1">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <div class="flex items-center gap-3.5 mb-6 border-b-2 border-dashed border-[#d4a373] pb-4">
                <div class="w-12 h-12 rounded-2xl bg-[#c2593f] text-white flex items-center justify-center shadow-[3px_3px_0px_#2b2d42]">
                    <i data-lucide="user-plus" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 class="font-vintage text-2xl text-[#2b2d42]" id="reg-modal-title">नया शिल्पकार पंजीकरण</h3>
                    <p class="text-xs font-stamp text-[#6c757d]">ग्राम पंचायत सत्यापन व विश्वकर्मा सहायता डेस्क</p>
                </div>
            </div>

            <form onsubmit="handleRegistrationSubmit(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-stamp font-bold text-[#2b2d42] mb-1">शिल्पकार का पूरा नाम (Full Name)</label>
                    <input type="text" id="reg-artisan-name" required value="मीनाक्षी कुमारी" class="w-full px-3.5 py-2.5 text-xs bg-[#f6f1e9] border border-[#d4a373] rounded-xl focus:bg-white focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-stamp font-bold text-[#2b2d42] mb-1">हस्तशिल्प विधा (Craft Discipline)</label>
                    <select id="reg-artisan-craft" class="w-full px-3.5 py-2.5 text-xs bg-[#f6f1e9] border border-[#d4a373] rounded-xl focus:bg-white focus:outline-none">
                        <option value="मधुबनी पेंटिंग">मधुबनी चित्रकला (Madhubani Painting)</option>
                        <option value="खुर्जा पॉटरी">खुर्जा मिट्टी कला (Khurja Pottery)</option>
                        <option value="भागलपुरी टसर सिल्क">भागलपुरी टसर सिल्क (Tussar Silk Handloom)</option>
                        <option value="सहारनपुर काष्ठशिल्प">सहारनपुर काष्ठ नक्काशी (Wood Carving)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-stamp font-bold text-[#2b2d42] mb-1">ग्राम पंचायत व ज़िला (Gram Panchayat & District)</label>
                    <input type="text" id="reg-artisan-panchayat" required value="रंती ग्राम पंचायत, मधुबनी, बिहार" class="w-full px-3.5 py-2.5 text-xs bg-[#f6f1e9] border border-[#d4a373] rounded-xl focus:bg-white focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-stamp font-bold text-[#2b2d42] mb-1">मोबाइल नंबर (Mobile Number)</label>
                    <input type="tel" id="reg-artisan-phone" required value="9876543210" class="w-full px-3.5 py-2.5 text-xs bg-[#f6f1e9] border border-[#d4a373] rounded-xl focus:bg-white focus:outline-none">
                </div>

                <div class="p-3 bg-[#fefae0] rounded-xl border border-[#d4a373]">
                    <label class="flex items-start gap-2 cursor-pointer">
                        <input type="checkbox" id="reg-artisan-assist" checked class="mt-0.5 rounded text-[#c2593f]">
                        <span class="text-[11px] font-stamp text-[#2b2d42] leading-tight">
                            <b>कला सखी / CSC VLE सहायता चाहिए:</b> स्मार्टफोन या कैमरा नहीं है, कृपया दीदी को घर भेजें।
                        </span>
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 bg-[#c2593f] hover:bg-[#a6472e] text-white font-bold text-xs font-stamp uppercase tracking-wider rounded-xl shadow-[3px_3px_0px_#2b2d42] transition flex items-center justify-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    <span>पंजीकरण दर्ज करें व टोकन प्राप्त करें</span>
                </button>
            </form>
        </div>
    </div>
